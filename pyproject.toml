[project]
name = "demand-radar"
version = "0.1.0"
description = "Open-source, self-hosted research tool for studying how people describe problems in public online communities."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Demand Radar contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["research", "qualitative-research", "voice-of-customer", "self-hosted", "open-source"]

dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
demand-radar = "demand_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API *is* a call in the argument default; B008 is a false positive here.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
